version: 2

project_name: lerobot-go

before:
  hooks:
    - go mod tidy
    - go test ./... -count=1

builds:
  - id: lerobot-go
    main: ./cmd/lerobot-go
    binary: lerobot-go
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/ioai-tech/lerobot-go/internal/cli.AppVersion={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - README_zh.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  github:
    owner: ioai-tech
    name: lerobot-go
  draft: false
  prerelease: auto
